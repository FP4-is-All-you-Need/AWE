[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
license-files = ["LICENSE"]
name = "awe-catalog"
version = "0.1.0"
description = "Exact AWE construction catalog and mathematical diagrams"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
awe = "awe_catalog.__main__:main"

[tool.setuptools]
packages = ["awe_catalog", "verify"]
package-dir = {awe_catalog = "python/awe_catalog", verify = "verify"}
